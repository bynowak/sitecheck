<!doctype html>
<html lang="en">
  <head>
    <title>Sitecheck fixture: healthy page</title>
    <meta
      name="description"
      content="A deterministic fixture demonstrating clear website metadata, semantic content, and accessible controls for the Sitecheck audit engine."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://example.com/" />
    <link rel="icon" href="/favicon.svg" />
    <meta property="og:title" content="Healthy" />
    <meta property="og:description" content="Healthy page" />
    <meta property="og:image" content="https://example.com/image.png" />
    <meta property="og:url" content="https://example.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Healthy" />
    <meta name="twitter:description" content="Healthy" />
    <meta name="twitter:image" content="https://example.com/image.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Healthy"
      }
    </script>
  </head>
  <body>
    <header>
      <nav><a href="/about">About</a></nav>
    </header>
    <main>
      <h1>Healthy website</h1>
      <h2>Details</h2>
      <img src="/decorative.svg" alt="" />
      <form>
        <label for="email">Email</label
        ><input id="email" type="email" /><button>Subscribe</button>
      </form>
    </main>
    <footer>Sitecheck</footer>
  </body>
</html>
